# The Railway deploy leg (ADR 0021) builds this generated thin file — a single
# FROM <image>@sha256 — so Railway never rebuilds and never parses the repo's
# runtime Dockerfile (whose cache-mount ids the Metal builder rejects). The
# CLI v5 dropped RAILWAY_DOCKERFILE_PATH; config-as-code owns the path now.
[build]
dockerfilePath = ".bos/deploy/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
