name: Deploy

# Thin wrapper — the shared implementation lives in the base runtime repo
# (NEARBuilders/everything-dev). This repo owns triggers, secret policy, and
# working directory. The @main ref matches the sync trust model: bos sync
# already tracks the parent's main for all framework-owned files.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy
    uses: NEARBuilders/everything-dev/.github/workflows/consumer-deploy.yml@main
    with:
      working_directory: .
      verbose: ${{ inputs.verbose == true }}
    secrets: inherit
