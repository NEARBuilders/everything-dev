name: Staging

# Thin wrapper — the shared implementation lives in the base runtime repo
# (NEARBuilders/everything-dev). This repo owns triggers, secret policy, and
# working directory. The @main ref matches the sync trust model: bos sync
# already tracks the parent's main for all framework-owned files.
on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false
      storage_origin:
        description: 'Upload service origin (default: vars.BOS_STORAGE_ORIGIN or the shared service)'
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy Staging
    uses: NEARBuilders/everything-dev/.github/workflows/consumer-staging.yml@main
    with:
      working_directory: .
      verbose: ${{ inputs.verbose == true }}
      storage_origin: ${{ inputs.storage_origin || vars.BOS_STORAGE_ORIGIN || 'https://upload.everything.dev' }}
    secrets: inherit
