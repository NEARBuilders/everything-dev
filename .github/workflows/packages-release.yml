name: Packages Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: "Run publish/deploy steps even without pending changesets"
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release_mode.outputs.should_publish }}
    env:
      BOS_INSTALL_NEAR_CLI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Typecheck every-plugin
        run: bun run --cwd packages/every-plugin typecheck

      - name: Test every-plugin
        run: bun run --cwd packages/every-plugin test:all

      - name: Typecheck everything-dev
        run: bun run --cwd packages/everything-dev typecheck

      - name: Test everything-dev
        run: bun run --cwd packages/everything-dev test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: bun run version
          publish: bun run release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release mode
        id: release_mode
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: |
          if [ "$HAS_CHANGESETS" = "false" ] || [ "$FORCE_RELEASE" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.release_mode.outputs.should_publish == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          npm-version: "11"
          registry-url: "https://registry.npmjs.org"

      - name: Build packages for staging
        if: steps.release_mode.outputs.should_publish == 'true'
        env:
          ZE_SECRET_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
          ZE_SERVER_TOKEN: ${{ secrets.ZEPHYR_SERVER_AUTH_TOKEN }}
          ZE_USER_EMAIL: ${{ secrets.ZEPHYR_USER_EMAIL }}
        run: |
          bun run --cwd packages/every-plugin build
          bun run --cwd packages/everything-dev build

      - name: Stage release packages
        if: steps.release_mode.outputs.should_publish == 'true'
        run: bun run scripts/stage-release-packages.ts

      - name: Publish every-plugin to npm
        if: steps.release_mode.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          VERSION=$(jq -r .version .release/every-plugin/package.json)
          if npm view every-plugin@"$VERSION" version 2>/dev/null; then
            echo "every-plugin@$VERSION already published, skipping"
          else
            npm publish --provenance --access public .release/every-plugin
          fi

      - name: Publish everything-dev to npm
        if: steps.release_mode.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          VERSION=$(jq -r .version .release/everything-dev/package.json)
          if npm view everything-dev@"$VERSION" version 2>/dev/null; then
            echo "everything-dev@$VERSION already published, skipping"
          else
            npm publish --provenance --access public .release/everything-dev
          fi

      - name: Create GitHub Releases
        if: steps.release_mode.outputs.should_publish == 'true'
        run: |
          APP_KEYS=$(jq -r '.app | keys[]' bos.config.json)
          PLUGIN_KEYS=$(jq -r '.plugins | keys[]' bos.config.json 2>/dev/null || true)
          FRAMEWORK_PKGS="packages/every-plugin packages/everything-dev"

          ALL_KEYS=""
          for key in $APP_KEYS $PLUGIN_KEYS; do
            ALL_KEYS="$ALL_KEYS $key"
          done

          for pkg_dir in $ALL_KEYS $FRAMEWORK_PKGS; do
            PKG_JSON="${pkg_dir}/package.json"

            if [ ! -f "$PKG_JSON" ]; then
              echo "Skipping $pkg_dir - no package.json"
              continue
            fi

            VERSION=$(jq -r '.version' "$PKG_JSON")
            NAME=$(jq -r '.name' "$PKG_JSON")
            TAG="${NAME}@${VERSION}"

            if ! gh release view "$TAG" &>/dev/null; then
              echo "Creating release for $TAG"

              CHANGELOG="${pkg_dir}/CHANGELOG.md"
              NOTES=""
              if [ -f "$CHANGELOG" ]; then
                NOTES=$(sed -n "/^## ${VERSION}/,/^## [0-9]/p" "$CHANGELOG" | sed '$d' | tail -n +2)
              fi

              if [ -z "$NOTES" ]; then
                NOTES="Release $TAG"
              fi

              gh release create "$TAG" \
                --title "$TAG" \
                --notes "$NOTES" \
                --target main
            else
              echo "Release $TAG already exists, skipping"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy
    needs: [publish]
    if: needs.publish.outputs.should_publish == 'true'
    uses: ./.github/workflows/release.yml
    with:
      deploy: true
    secrets: inherit
