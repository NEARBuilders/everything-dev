name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Deploy gate: only fresh CI runs of a push to main, and only while the
  # validated commit is still the tip of main. Manual dispatches must run
  # against main; stale runs are skipped (the queued run for the new tip
  # deploys instead).
  gate:
    name: Verify deploy is current
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.tip.outputs.current == 'true' && steps.relevance.outputs.relevant == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Verify the CI-validated commit is still the main tip
        id: tip
        run: |
          git fetch --no-tags origin main
          TIP="$(git rev-parse origin/main)"
          SHA="$(git rev-parse HEAD)"
          if [ "$SHA" = "$TIP" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy — main advanced past the CI-validated commit ($SHA → $TIP). The queued run for the new tip deploys instead."
          fi

      # Relevance gate: skip the full deploy train when the merged diff touches
      # no runtime-affecting paths (docs/tests/workflows/changesets only).
      # Merge commits (PR merges) diff exactly the PR's files; single-commit
      # direct pushes too. Any uncertainty errs toward deploying, and manual
      # dispatches always deploy.
      - name: Check the diff for runtime-relevant paths
        id: relevance
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "::notice::No parent commit — assuming runtime-relevant"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only HEAD^ HEAD)"
          if [ -z "$FILES" ]; then
            echo "::notice::Empty first-parent diff (merge-tangle history) — assuming runtime-relevant"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$FILES" | grep -qE '^Dockerfile$|^railway\.toml$|^scripts/|^host/|^api/|^ui/|^plugins/|^packages/|^bos\.app\.ts$|^bos\.dev\.ts$|^biome\.json$|^\.env\.test$|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|tsconfig\.base\.json)$|^\.github/workflows/(ci|deploy|release)\.yml$|^\.github/templates/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy — the merged diff touches no runtime-relevant paths:"
            while IFS= read -r f; do echo "  $f"; done <<< "$FILES"
          fi

  # Image leg: build the `runtime` stage and push it to GHCR (sha-<short> +
  # version tags, latest held on prereleases) BEFORE any config/bundle publish,
  # so a failed image push cannot leave a partially published deploy. The
  # captured digest is handed to the deploy job (BOS_IMAGE_DIGEST), which pins
  # the pull-only Railway deploy to it. Self-contained: the Dockerfile builds
  # all workspaces from source in-image — no node/pnpm setup needed here.
  image:
    name: Build and push runtime image
    needs: [gate]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push the runtime image
        id: push
        # Mirrors the CLI image leg (packages/everything-dev/src/image-deploy.ts
        # — buildAndPushImage/computeImageTags): image ref via BOS_IMAGE →
        # derived from the repository (ci.image in bos.app.ts is not parsed
        # here); tags sha-<short> always, the exact v<version> tag, and the
        # floating v<major> + :latest on stable releases only — :latest is held
        # during prereleases so pinned deployments keep serving the last stable
        # image. Keep in sync with computeImageTags when either side changes.
        env:
          BOS_IMAGE: ${{ vars.BOS_IMAGE }}
        run: |
          set -euo pipefail
          IMAGE="${BOS_IMAGE:-ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          VERSION="$(node -p "require('./packages/everything-dev/package.json').version")"

          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            EXACT="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
            if [ -n "${BASH_REMATCH[4]}" ]; then
              TAGS=("sha-$SHORT_SHA" "$EXACT")
              echo "::notice::latest held: $EXACT is a prerelease — :latest still serves the last stable image"
            else
              TAGS=("sha-$SHORT_SHA" "$EXACT" "v${BASH_REMATCH[1]}")
            fi
          else
            TAGS=("sha-$SHORT_SHA")
          fi

          REFS=("${TAGS[@]/#/$IMAGE:}")
          BUILD_ARGS=()
          for ref in "${REFS[@]}"; do
            BUILD_ARGS+=(-t "$ref")
          done
          echo "Building runtime image ${REFS[*]}..."
          docker build --target runtime "${BUILD_ARGS[@]}" .

          DIGEST=""
          for ref in "${REFS[@]}"; do
            echo "Pushing $ref..."
            if [ -z "$DIGEST" ]; then
              OUT="$(docker push "$ref" 2>&1)" || { printf '%s\n' "$OUT"; exit 1; }
              DIGEST="$(printf '%s\n' "$OUT" | grep -oE 'sha256:[a-f0-9]{64}' | tail -1 || true)"
            else
              docker push "$ref"
            fi
          done

          if [ -z "$DIGEST" ]; then
            echo "::error::Could not capture the image digest from push output"
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Production
    needs: [gate, image]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
      BOS_STORAGE_API_KEY: ${{ secrets.BOS_STORAGE_API_KEY }}
      BOS_BUNDLE_CDN_ORIGIN: https://cdn.everything.dev
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Pre-pushed image from the image job — bos deploy skips its local
      # image build/push and pins the Railway deploy to this digest.
      BOS_IMAGE: ${{ needs.image.outputs.image }}
      BOS_IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Guard — no stray bun artifacts
        run: |
          if [ -f bun.lock ]; then
            echo "::error::bun.lock present — bun re-migrated the workspace (ADR 0026). Delete bun.lock and re-run pnpm install."
            exit 1
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Deploy (preflight → build → upload → publish → Railway pin)
        timeout-minutes: 50
        # One command runs the deploy train (ADR 0020/0021, image leg split
        # into the `image` job): staleness-checked prerequisite builds +
        # workspace dists, bundle upload to the R2-backed storage, FastKV
        # publish with read-back confirmation, then a pull-only Railway deploy
        # pinned to the digest pushed by the image job (BOS_IMAGE_DIGEST) via
        # a generated thin Dockerfile.
        run: pnpm run bos deploy${{ inputs.verbose == true && ' --verbose' || '' }}

      - name: Verify bundle compatibility (bos mf check)
        timeout-minutes: 5
        run: |
          # Gate the deployment: all host/plugin bundles must agree on
          # shared-dep versions (exact for effect-critical deps) and
          # pluginVersion. Runs AFTER the deploy — CDN-mode bundles serve
          # from cdn.everything.dev, so the check passes once the config is
          # published and the new bytes are live.
          attempts=10
          until pnpm run bos mf check; do
            attempts=$((attempts - 1))
            if [ "$attempts" -le 0 ]; then
              echo "::error::Bundle compatibility check failed — bundles are inconsistent (deployment did not come up healthy or has a version mismatch). See bos mf check output."
              exit 1
            fi
            echo "bos mf check failed; retrying in 20s ($attempts attempt(s) left)…"
            sleep 20
          done

      - name: Deploy smoke — remote runtime against the live deployment
        timeout-minutes: 10
        # ADR 0009 §4: published-config coverage lives in the Deploy workflow.
        # Boots the real host program against the live production URLs from the
        # deployed SHA's bos.config.json — SSR compose from the deployed ui,
        # doc-asset proxy, api ping, root document contract. bos mf check has
        # already verified the site is up and consistent above.
        run: pnpm --filter host test:integration:remote
