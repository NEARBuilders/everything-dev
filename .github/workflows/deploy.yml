name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
      ZE_CI_TOKEN: ${{ secrets.ZEPHYR_CI_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      TARGET_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      API_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5432/api_db
      AUTH_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5433/auth_db
      CORS_ORIGIN: http://127.0.0.1:4100
    services:
      postgres-api:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: api_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-auth:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Sync to triggering commit
        run: git reset --hard "$TARGET_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: "1.22"

      - name: Install Playwright browser
        run: bun run test:regression:browser:install

      - name: Install NEAR CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/near-cli-rs/releases/download/v0.23.5/near-cli-rs-installer.sh | sh

      - name: Verify NEAR CLI
        run: near --version

      - name: Configure Zephyr auth fallback
        if: ${{ env.ZE_CI_TOKEN == '' }}
        env:
          ZEPHYR_AUTH_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
          ZEPHYR_USER_EMAIL: ${{ secrets.ZEPHYR_USER_EMAIL }}
        run: |
          echo "ZE_SERVER_TOKEN=$ZEPHYR_AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "ZE_USER_EMAIL=$ZEPHYR_USER_EMAIL" >> "$GITHUB_ENV"

      - name: Publish with deploy
        timeout-minutes: 20
        run: bun run bos publish --deploy${{ inputs.verbose == true && ' --verbose' || '' }}

      - name: Validate production regression against published remotes
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            if bun run test:regression:prod; then
              echo "Production regression passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s (propagation delay)..."
            sleep 15
          done
          echo "Production regression failed after 3 attempts"
          exit 1

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Redeploy Railway
        run: railway redeploy --service app --yes

      - name: Commit and push bos.config.json updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bos.config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update deployment URLs [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "$TARGET_BRANCH" && git push origin HEAD:"$TARGET_BRANCH" && exit 0
              sleep 3
            done
            exit 1
          fi

      - name: Create GitHub Releases for deployed workspaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          changelogs=( */CHANGELOG.md plugins/*/CHANGELOG.md )
          shopt -u nullglob

          for changelog in "${changelogs[@]}"; do
            pkg_dir=$(dirname "$changelog")

            [[ "$(basename "$pkg_dir")" == _* ]] && continue

            PKG_JSON="$pkg_dir/package.json"
            [ ! -f "$PKG_JSON" ] && continue

            VERSION=$(jq -r '.version // empty' "$PKG_JSON")
            NAME=$(jq -r '.name // empty' "$PKG_JSON")
            [ -z "$VERSION" ] || [ -z "$NAME" ] && continue

            TAG="${NAME}@${VERSION}"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists, skipping"
              continue
            fi

            NOTES=$(sed -n "/^## ${VERSION}/,/^## [0-9]/p" "$changelog" | sed '$d' | tail -n +2)
            [ -z "$NOTES" ] && NOTES="Release $TAG"

            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              --target "$TARGET_BRANCH"
          done
