name: Deploy

on:
  repository_dispatch:
    types: [release-completed]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
      # Zephyr server-token auth. Zephyr directly advised us to retain this flow for
      # our workflow even though server tokens are being deprecated in favor of CI
      # tokens. We fall back to ZE_CI_TOKEN (below) only if ZEPHYR_AUTH_TOKEN is unset.
      # See https://docs.zephyr-cloud.io/migrations/ci-token-migration
      ZE_SERVER_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
      ZE_USER_EMAIL: ${{ secrets.ZEPHYR_USER_EMAIL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TARGET_SHA: ${{ github.event.client_payload.sha || github.sha }}
      TARGET_BRANCH: ${{ github.ref_name }}
      API_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5432/api_db
      AUTH_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5433/auth_db
      CORS_ORIGIN: http://127.0.0.1:4100
    services:
      postgres-api:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: api_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-auth:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Sync to triggering commit
        run: git reset --hard "$TARGET_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Install NEAR CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/near-cli-rs/releases/download/v0.23.5/near-cli-rs-installer.sh | sh

      - name: Verify NEAR CLI
        run: near --version

      - name: Configure Zephyr CI token fallback
        if: ${{ env.ZE_SERVER_TOKEN == '' }}
        env:
          ZEPHYR_CI_TOKEN: ${{ secrets.ZEPHYR_CI_TOKEN }}
        run: |
          echo "ZE_CI_TOKEN=$ZEPHYR_CI_TOKEN" >> "$GITHUB_ENV"

      - name: Publish with deploy
        timeout-minutes: 20
        run: bun run bos publish --deploy${{ inputs.verbose == true && ' --verbose' || '' }}

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Redeploy Railway
        run: railway redeploy --service app --yes

      - name: Commit and push bos.config.json updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bos.config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update deployment URLs [skip ci]"
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              git fetch origin "$TARGET_BRANCH"
              git rebase "origin/$TARGET_BRANCH" && git push origin HEAD:"$TARGET_BRANCH" && exit 0
              sleep 5
            done
            exit 1
          fi
