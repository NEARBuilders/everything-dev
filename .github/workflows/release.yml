# Root-only release flow (changesets version PR + publish) — never synced to
# children: #572 removed changesets from the child template entirely.
name: Release

# Fires directly on push to main. The tiering contract (docs/agents/testing.md)
# puts the full regression matrix here — the publish gate — instead of on every
# PR: when main has no pending changesets, a publish is imminent, so the full
# matrix must be green before `changesets` runs. Ordinary merges (pending
# changesets exist) only open/update the version PR and pay nothing extra;
# the version PR itself fast-paths CI (ci.yml) because this workflow owns the
# release plane's validation.
#
# The version PR ("chore: version packages") is created by the changesets
# action and is the release lever: MERGING it publishes npm and fires this
# workflow's regression + publish legs, like any other push to main. It must
# be merged by a maintainer — never by automation engaged with GITHUB_TOKEN:
# merges that token performs are swallowed by GitHub's event-recursion guard,
# so the push that lands the release would fire no workflows at all and the
# rc would strand until an unrelated merge happened to wake it (the Nov-03
# stranding).
on:
  push:
    branches: [main]
  # Manual retry leg: npm/OIDC/registry blips whose CI already ran repay
  # a dispatch instead of a push.
  workflow_dispatch:

# cancel-in-progress: the run for the newest tip supersedes older runs.
# The race that motivated this: two "Process Changesets" legs force-pushed
# the bot's version-PR branch concurrently ("failed to push some refs").
# Cancellation mid-publish is recoverable by design — the publish script
# stages exact version pins and re-publishing is registry-idempotent, so
# the superseding run heals any partially-published set. The regression
# leg inherits the group: a cancelled gate re-runs on the newer tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Verify release is current
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.tip.outputs.current == 'true' }}
      # rc = release candidate: no pending changesets means the changesets
      # action will PUBLISH on this run (a version PR just merged, or a
      # continuous release) — the full regression gates exactly that case.
      rc: ${{ steps.rc.outputs.rc == 'true' && steps.tip.outputs.current == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      # Mirrors Deploy's gate: a newer push to main makes this run's release
      # stale — the queued run for the new tip releases instead, and two
      # publishes never race a moving pointer.
      - name: Verify the CI-validated commit is still the main tip
        id: tip
        run: |
          git fetch --no-tags origin main
          TIP="$(git rev-parse origin/main)"
          SHA="$(git rev-parse HEAD)"
          if [ "$SHA" = "$TIP" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release — main advanced past the CI-validated commit ($SHA → $TIP). The queued run for the new tip releases instead."
          fi

      - name: Detect a release candidate (publish imminent)
        id: rc
        run: |
          if find .changeset -maxdepth 1 -name '*.md' -print -quit | grep -q .; then
            echo "rc=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pending changesets — this run opens/updates the version PR; the regression gate does not apply"
          else
            echo "rc=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No pending changesets — a publish is imminent; the full regression gates it"
          fi

  # The release gate: the full regression matrix must be green before npm
  # sees anything. Dispatched as a manual retry (workflow_dispatch), the rc
  # detection runs the same way — a deliberate re-publish re-proves the tree.
  regression:
    name: Release gate — full regression
    needs: [gate]
    if: needs.gate.outputs.release == 'true' && needs.gate.outputs.rc == 'true'
    uses: ./.github/workflows/regression-full.yml

  release:
    name: Process Changesets
    needs: [gate, regression]
    # Run when: the tip is current AND (no publish is imminent, so only the
    # version-PR leg is needed) OR the regression gate went green.
    if: >-
      always() &&
      needs.gate.outputs.release == 'true' &&
      (needs.gate.outputs.rc != 'true' || needs.regression.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: it injects an empty `_authToken` into the job's
      # .npmrc, which blocks npm's OIDC trusted-publishing exchange
      # (publish fails with ENEEDAUTH instead of using the OIDC token).
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Get pnpm store dir
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (Node 24)
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # No pre-build here: `pnpm run release`
      # (scripts/publish-release-packages.ts) builds every publishable
      # workspace itself before staging and publishing.

      - name: Create Release PR or Publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The version PR is the release lever and merges by hand. Automation
      # MUST NOT merge it: auto-merge engaged with GITHUB_TOKEN performs the
      # merge as app/github-actions, and GitHub's event-recursion guard
      # swallows the push events that token triggers — the rc would strand
      # until an unrelated merge fired the workflows (the Nov-03 stranding).
      # A parked release is simply an unmerged version PR.

      # npm's OIDC helper never throws — when the registry rejects the token
      # exchange (e.g. trusted-publisher mismatch or missing "npm publish"
      # allowance), publish fails with a bare ENEEDAUTH and the real reason
      # is only logged at verbose level inside npm's debug log.
      - name: Dump npm OIDC diagnostics
        if: failure()
        run: grep -i oidc /home/runner/.npm/_logs/*.log || true

  # Version bumps structurally outdate the skills' library_version markers,
  # and the release event created with GITHUB_TOKEN is swallowed by GitHub's
  # event-recursion guard — check-skills' review job would never fire on its
  # own. Dispatch it explicitly after a successful publish (workflow_dispatch
  # is the event type that DOES run when triggered with GITHUB_TOKEN).
  # Own job so `actions: write` never coexists with the publish job's
  # contents/id-token scopes.
  dispatch-skills:
    name: Dispatch skill drift review
    needs: [release]
    if: always() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch check-skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh workflow run check-skills.yml --ref main
