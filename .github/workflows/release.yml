name: Release

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: "Publish package releases even when changesets were just consumed"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref or SHA to release"
        required: false
        default: ""
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Publish Packages
    runs-on: ubuntu-latest
    env:
      TARGET_REF: ${{ inputs.ref != '' && inputs.ref || github.sha }}
    outputs:
      should_publish: ${{ steps.release_mode.outputs.should_publish }}
      target_ref: ${{ steps.target_ref.outputs.ref }}
      actually_published: ${{ steps.npm_publish.outputs.actually_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_REF }}

      - name: Capture checked-out commit
        id: target_ref
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: pnpm --filter every-plugin build

      - name: Create release PR when changesets are pending
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Determine release mode
        id: release_mode
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
          FORCE_RELEASE: ${{ inputs.force_release && 'true' || 'false' }}
        run: |
          if [ "$HAS_CHANGESETS" = "false" ] || [ "$FORCE_RELEASE" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.release_mode.outputs.should_publish == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          npm-version: "11"
          registry-url: "https://registry.npmjs.org"

      - name: Build publishable packages
        if: steps.release_mode.outputs.should_publish == 'true'
        run: |
          for pkg_json in packages/*/package.json; do
            if [ ! -f "$pkg_json" ]; then
              continue
            fi

            if [ "$(jq -r '.private // false' "$pkg_json")" = "true" ]; then
              continue
            fi

            pkg_dir=$(dirname "$pkg_json")
            if jq -e '.scripts.build' "$pkg_json" >/dev/null; then
              pnpm --filter "$(jq -r '.name' "$pkg_json")" run build
            fi
          done

      - name: Stage release packages
        if: steps.release_mode.outputs.should_publish == 'true'
        run: node --import tsx scripts/stage-release-packages.ts

      - name: Publish packages to npm
        id: npm_publish
        if: steps.release_mode.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          PUBLISHED=0
          NPM_TAG_ARGS=()
          if [ -f .changeset/pre.json ] && [ "$(jq -r '.mode // ""' .changeset/pre.json)" = "pre" ]; then
            PRERELEASE_TAG=$(jq -r '.tag // "rc"' .changeset/pre.json)
            NPM_TAG_ARGS=(--tag "$PRERELEASE_TAG")
            echo "Prerelease mode active: publishing under dist-tag '$PRERELEASE_TAG'"
          fi
          for release_dir in .release/*; do
            if [ ! -f "$release_dir/package.json" ]; then
              continue
            fi

            VERSION=$(jq -r .version "$release_dir/package.json")
            NAME=$(jq -r .name "$release_dir/package.json")

            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already published, skipping"
            else
              npm publish --provenance --access public "${NPM_TAG_ARGS[@]}" "$release_dir"
              PUBLISHED=$((PUBLISHED + 1))
            fi
          done
          echo "actually_published=$([[ $PUBLISHED -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Releases
        if: steps.release_mode.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.target_ref.outputs.ref }}
        run: |
          for release_dir in .release/*; do
            PKG_JSON="$release_dir/package.json"
            if [ ! -f "$PKG_JSON" ]; then
              continue
            fi

            VERSION=$(jq -r '.version' "$PKG_JSON")
            NAME=$(jq -r '.name' "$PKG_JSON")
            TAG="${NAME}@${VERSION}"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists, skipping"
              continue
            fi

            CHANGELOG="$release_dir/CHANGELOG.md"
            NOTES=""
            if [ -f "$CHANGELOG" ]; then
              NOTES=$(sed -n "/^## ${VERSION}/,/^## [0-9]/p" "$CHANGELOG" | sed '$d' | tail -n +2)
            fi
            if [ -z "$NOTES" ]; then
              NOTES="Release $TAG"
            fi

            GH_RELEASE_ARGS=()
            if [[ "$VERSION" == *-* ]]; then
              GH_RELEASE_ARGS=(--prerelease)
            fi

            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              --target "$RELEASE_COMMIT" \
              "${GH_RELEASE_ARGS[@]}"
          done
