# Root-only release flow (changesets version PR + publish) — never synced to
# children: #572 removed changesets from the child template entirely.
name: Release

# Fires directly on push: the merge queue is the CI gate for main (the
# merge-queue batch that produced this commit ran the full suite and could
# only merge on green), so a separate CI-success signal is not needed.
# The gate job still guards staleness — a newer tip releases instead of
# this run.
#
# The version PR ("chore: version packages") is created by the changesets
# action and merged via the manual merge button (a maintainer bypass, as
# always). It would normally trip every CI detect-changes arm over a
# package.json-only diff; instead detect-changes fast-paths
# `changeset-release/*` PRs to an all-skipped run, so the required `CI gate`
# check goes green without paying the regression matrix — the publish
# script's own builds and npm's registry checks are the real gates here.
on:
  push:
    branches: [main]
  # Manual retry leg: npm/OIDC/registry blips whose CI already ran repay
  # a dispatch instead of a push.
  workflow_dispatch:

# cancel-in-progress: the run for the newest tip supersedes older runs.
# The race that motivated this: two "Process Changesets" legs force-pushed
# the bot's version-PR branch concurrently ("failed to push some refs").
# Cancellation mid-publish is recoverable by design — the publish script
# stages exact version pins and re-publishing is registry-idempotent, so
# the superseding run heals any partially-published set.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: write
  actions: write

jobs:
  gate:
    name: Verify release is current
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.tip.outputs.current == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      # Mirrors Deploy's gate: a newer push to main makes this run's release
      # stale — the queued run for the new tip releases instead, and two
      # publishes never race a moving pointer.
      - name: Verify the CI-validated commit is still the main tip
        id: tip
        run: |
          git fetch --no-tags origin main
          TIP="$(git rev-parse origin/main)"
          SHA="$(git rev-parse HEAD)"
          if [ "$SHA" = "$TIP" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release — main advanced past the CI-validated commit ($SHA → $TIP). The queued run for the new tip releases instead."
          fi

  release:
    name: Process Changesets
    needs: [gate]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: it injects an empty `_authToken` into the job's
      # .npmrc, which blocks npm's OIDC trusted-publishing exchange
      # (publish fails with ENEEDAUTH instead of using the OIDC token).
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Get pnpm store dir
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (Node 24)
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # No pre-build here: `pnpm run release`
      # (scripts/publish-release-packages.ts) builds every publishable
      # workspace itself before staging and publishing.

      - name: Create Release PR or Publish to npm
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm run version
          publish: pnpm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Zero-touch releases: when this run opened/updated the version PR,
      # queue its merge — auto-merge enqueues the pull request into the
      # merge queue as soon as the fast-path `CI gate` goes green, so each
      # merge that lands changesets publishes a new release minutes later
      # without a human merge-button stop.
      #
      # Escape hatch: a maintainer labels the version PR `hold-release` to
      # park a big scope in the same release (the PR object persists across
      # bot updates, so the label sticks); remove the label and the next
      # run engages the auto-merge. Merging remains possible by hand at any
      # time — the label only turns off the automation.
      - name: Engage release auto-merge
        if: >-
          steps.changesets.outputs.published != 'true' &&
          steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh pr list --state open --head changeset-release/main --json number --jq '.[0].number // empty')"
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::No open version PR — nothing to auto-merge"
            exit 0
          fi
          LABELS="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | join(",")')"
          if echo ",$LABELS," | grep -q ',hold-release,'; then
            echo "::notice::hold-release label present on #$PR_NUMBER — parking the release; merge manually when the big scope is ready (remove the label to re-engage automation)"
            exit 0
          fi
          if gh pr merge "$PR_NUMBER" --auto --squash; then
            echo "::notice::Auto-merge engaged on #$PR_NUMBER — the release ships once the queue merges it"
          else
            echo "::warning::Auto-merge unavailable for #$PR_NUMBER (merge-queue enqueue or default auto-merge needs attention) — merge manually: https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          fi
      # Version bumps structurally outdate the skills' library_version
      # markers, and the release event these packages create with
      # GITHUB_TOKEN is swallowed by GitHub's event-recursion guard — so
      # check-skills' review job would never fire on its own. Dispatch it
      # explicitly after a successful publish (workflow_dispatch is the
      # event type that DOES run when triggered with GITHUB_TOKEN).
      - name: Dispatch skill drift review
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh workflow run check-skills.yml --ref main

      # npm's OIDC helper never throws — when the registry rejects the token
      # exchange (e.g. trusted-publisher mismatch or missing "npm publish"
      # allowance), publish fails with a bare ENEEDAUTH and the real reason
      # is only logged at verbose level inside npm's debug log.
      - name: Dump npm OIDC diagnostics
        if: failure()
        run: grep -i oidc /home/runner/.npm/_logs/*.log || true
