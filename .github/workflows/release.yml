name: Release

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: "Publish package releases even when changesets were just consumed"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref or SHA to release"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Publish Packages
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    env:
      TARGET_REF: ${{ inputs.ref != '' && inputs.ref || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
    outputs:
      should_publish: ${{ steps.release_mode.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_REF }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Create release PR when changesets are pending
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: bun run version
          publish: bun run release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Determine release mode
        id: release_mode
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
          FORCE_RELEASE: ${{ inputs.force_release && 'true' || 'false' }}
        run: |
          if [ "$HAS_CHANGESETS" = "false" ] || [ "$FORCE_RELEASE" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.release_mode.outputs.should_publish == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          npm-version: "11"
          registry-url: "https://registry.npmjs.org"

      - name: Build publishable packages
        if: steps.release_mode.outputs.should_publish == 'true'
        run: |
          for pkg_json in packages/*/package.json; do
            if [ ! -f "$pkg_json" ]; then
              continue
            fi

            if [ "$(jq -r '.private // false' "$pkg_json")" = "true" ]; then
              continue
            fi

            pkg_dir=$(dirname "$pkg_json")
            if jq -e '.scripts.build' "$pkg_json" >/dev/null; then
              bun run --cwd "$pkg_dir" build
            fi
          done

      - name: Stage release packages
        if: steps.release_mode.outputs.should_publish == 'true'
        run: bun run scripts/stage-release-packages.ts

      - name: Publish packages to npm
        if: steps.release_mode.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          for release_dir in .release/*; do
            if [ ! -f "$release_dir/package.json" ]; then
              continue
            fi

            VERSION=$(jq -r .version "$release_dir/package.json")
            NAME=$(jq -r .name "$release_dir/package.json")

            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already published, skipping"
            else
              npm publish --provenance --access public "$release_dir"
            fi
          done

      - name: Create GitHub Releases
        if: steps.release_mode.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for release_dir in .release/*; do
            PKG_JSON="$release_dir/package.json"
            if [ ! -f "$PKG_JSON" ]; then
              continue
            fi

            VERSION=$(jq -r '.version' "$PKG_JSON")
            NAME=$(jq -r '.name' "$PKG_JSON")
            TAG="${NAME}@${VERSION}"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists, skipping"
              continue
            fi

            CHANGELOG="$release_dir/CHANGELOG.md"
            NOTES=""
            if [ -f "$CHANGELOG" ]; then
              NOTES=$(sed -n "/^## ${VERSION}/,/^## [0-9]/p" "$CHANGELOG" | sed '$d' | tail -n +2)
            fi
            if [ -z "$NOTES" ]; then
              NOTES="Release $TAG"
            fi

            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              --target main
          done
