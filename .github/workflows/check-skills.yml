# Validates intent skills on PRs. After a release or manual run, opens or
# updates one review PR when existing skills, artifact coverage, or workspace
# package coverage need review.
#
# Triggers: pull requests touching skills/artifacts or the source trees that
# package-skill `metadata.sources` point into, new release published, or manual
# workflow_dispatch. Source-tree triggers matter: file moves in non-skills PRs
# are exactly what silently rots the sources lists.
#
# intent-workflow-version: 3 (locally extended — reconcile on the next
# `intent setup` regeneration; keep the validate/stale additions and path list)

name: Check Skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - '**/skills/**'
      - '_artifacts/**'
      - '**/_artifacts/**'
      - 'packages/*/src/**'
      - 'ui/src/**'
      - 'api/src/**'
      - 'host/src/**'
      - 'plugins/**'
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate intent skills
    # Changeset release PRs bump every package version at once, so `stale`
    # structurally reports version drift there — the library_version markers
    # mean "reviewed against this published version" and are reconciled by the
    # review job below (or its review PR) after the release actually publishes.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install intent CLI
        run: pnpm add -g @tanstack/intent

      # NOTE: this validate step is currently RED for both packages (~86
      # pre-existing snippet findings — mixed excerpt-parse pedantry and
      # possible real drift; triage in #298). Once clean, also validate
      # packages/better-near-auth (~37 more findings) and drop this note.
      - name: Validate skills
        run: |
          intent validate packages/everything-dev --github-summary
          intent validate packages/every-plugin --github-summary

      # stale detects skill-vs-library content/version drift (needsReview).
      # Dead metadata.sources paths are caught by docs:check in ci.yml —
      # stale does not verify source existence.
      - name: Check skill drift
        run: |
          for pkg in packages/everything-dev packages/every-plugin packages/better-near-auth; do
            if ! intent stale "$pkg" --json > "$RUNNER_TEMP/stale.json" 2> "$RUNNER_TEMP/stale.err"; then
              echo "::error::intent stale failed for $pkg:"
              cat "$RUNNER_TEMP/stale.err"
              exit 1
            fi
            if grep -q '"needsReview": true' "$RUNNER_TEMP/stale.json"; then
              echo "::error::Skill drift detected in $pkg — run 'pnpm dlx @tanstack/intent@latest stale $pkg' locally and review"
              exit 1
            fi
          done

  review:
    name: Check intent skill coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install intent CLI
        run: pnpm add -g @tanstack/intent

      - name: Check skills
        id: stale
        run: |
          intent stale --github-review --package-label "everything-dev"

      - name: Open or update review PR
        if: steps.stale.outputs.has_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name || 'manual' }}"
          BRANCH="skills/review-${VERSION}"
          BASE_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
            git commit --allow-empty -m "chore: review intent skills for ${VERSION}"
            git push origin "$BRANCH"
          fi

          PR_URL="$(gh pr list --head "$BRANCH" --json url --jq '.[0].url')"
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --body-file pr-body.md
          else
            gh pr create \
              --title "Review intent skills (${VERSION})" \
              --body-file pr-body.md \
              --head "$BRANCH" \
              --base "$BASE_BRANCH"
          fi
