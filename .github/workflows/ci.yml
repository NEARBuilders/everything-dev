name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Security audit
        id: audit
        timeout-minutes: 5
        env:
          AUDIT_STRICT: ${{ secrets.AUDIT_STRICT }}
        run: |
          set +e -o pipefail
          timeout 120 bun audit 2>&1 | tee audit-output.txt
          audit_exit=$?
          if [ "$audit_exit" -eq 124 ]; then
            echo "::warning::bun audit timed out after 120s — skipping vulnerability check"
            exit 0
          fi
          if [ "$audit_exit" -gt 1 ]; then
            echo "::warning::bun audit exited with code $audit_exit — see output above"
            exit 0
          fi
          if grep -qiE '(critical|high)' audit-output.txt; then
            if [ "$AUDIT_STRICT" = "true" ]; then
              echo "::error::Critical or high vulnerabilities found — failing the audit"
              exit 1
            else
              echo "::warning::Critical or high vulnerabilities found — set AUDIT_STRICT=true secret to fail on these"
            fi
          fi

      - name: Run Biome lint and format check
        run: bun biome ci .

      - name: Run typecheck
        run: bun typecheck

  regression:
    name: Regression
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    timeout-minutes: 30
    env:
      CI: true
      API_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5432/api_db
      AUTH_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5433/auth_db
      CORS_ORIGIN: http://localhost:4100
    services:
      postgres-api:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: api_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-auth:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Install Playwright browser
        run: bun run test:regression:browser:install

      - name: Run regression suite
        run: bun run test:regression

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: |
            .bos/logs/**
            playwright-report/**
            test-results/**
