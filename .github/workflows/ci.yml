name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      everything-dev: ${{ steps.changes.outputs.everything-dev }}
      every-plugin: ${{ steps.changes.outputs.everything-plugin }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "everything-dev=true" >> "$GITHUB_OUTPUT"
            echo "every-plugin=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              BASE="HEAD~1"
            else
              git fetch origin "$BEFORE" --depth=1 2>/dev/null || true
              BASE="$BEFORE"
            fi
          fi

          DIFF=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "")
          if echo "$DIFF" | grep -qE '^packages/everything-dev/|^packages/every-plugin/'; then
            echo "everything-dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "everything-dev=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -qE '^packages/every-plugin/'; then
            echo "every-plugin=true" >> "$GITHUB_OUTPUT"
          else
            echo "every-plugin=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Security audit
        id: audit
        timeout-minutes: 5
        env:
          AUDIT_STRICT: ${{ secrets.AUDIT_STRICT }}
        run: |
          set +e -o pipefail
          timeout 120 bun audit 2>&1 | tee audit-output.txt
          audit_exit=$?
          if [ "$audit_exit" -eq 124 ]; then
            echo "::warning::bun audit timed out after 120s — skipping vulnerability check"
            exit 0
          fi
          if [ "$audit_exit" -gt 1 ]; then
            echo "::warning::bun audit exited with code $audit_exit — see output above"
            exit 0
          fi
          if grep -qiE '(critical|high)' audit-output.txt; then
            if [ "$AUDIT_STRICT" = "true" ]; then
              echo "::error::Critical or high vulnerabilities found — failing the audit"
              exit 1
            else
              echo "::warning::Critical or high vulnerabilities found — set AUDIT_STRICT=true secret to fail on these"
            fi
          fi

      - name: Run Biome lint and format check
        run: bun biome ci .

      - name: Run typecheck
        run: bun typecheck

  framework-tests:
    name: Framework tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.everything-dev == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Test everything-dev
        run: bun run --cwd packages/everything-dev test

  plugin-tests:
    name: Plugin runtime tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.every-plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Test every-plugin
        run: bun run --cwd packages/every-plugin test:all

  regression:
    name: Regression
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    timeout-minutes: 30
    env:
      CI: true
      API_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5432/api_db
      AUTH_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5433/auth_db
      CORS_ORIGIN: http://localhost:4100
      BETTER_AUTH_SECRET: regression-test-secret-do-not-use-in-production
    services:
      postgres-api:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: api_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-auth:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-template:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: template_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run regression suite
        run: bun run test:regression

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: |
            .bos/logs/**
            playwright-report/**
            test-results/**

  notify:
    name: Notify downstream workflows
    needs: [lint-and-typecheck, framework-tests, plugin-tests, regression]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Send repository dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh api repos/${{ github.repository }}/dispatches \
              --method POST \
              -f event_type=ci-main-success \
              -f "client_payload[sha]=${{ github.sha }}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
