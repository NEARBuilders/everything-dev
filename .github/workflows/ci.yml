name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".changeset/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      everything-dev: ${{ steps.changes.outputs.everything-dev }}
      every-plugin: ${{ steps.changes.outputs.every-plugin }}
      host: ${{ steps.changes.outputs.host }}
      regression-http: ${{ steps.changes.outputs.regression-http }}
      regression-framework: ${{ steps.changes.outputs.regression-framework }}
      regression-browser: ${{ steps.changes.outputs.regression-browser }}
      regression-unit: ${{ steps.changes.outputs.regression-unit }}
      image-smoke: ${{ steps.changes.outputs.image-smoke }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "everything-dev=true" >> "$GITHUB_OUTPUT"
            echo "every-plugin=true" >> "$GITHUB_OUTPUT"
            echo "host=true" >> "$GITHUB_OUTPUT"
            echo "regression-http=true" >> "$GITHUB_OUTPUT"
            echo "regression-framework=true" >> "$GITHUB_OUTPUT"
            echo "regression-browser=true" >> "$GITHUB_OUTPUT"
            echo "regression-unit=true" >> "$GITHUB_OUTPUT"
            echo "image-smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              BASE="HEAD~1"
            else
              git fetch origin "$BEFORE" --depth=1 2>/dev/null || true
              BASE="$BEFORE"
            fi
          fi

          if ! DIFF=$(git diff --name-only "$BASE" HEAD); then
            echo "everything-dev=true" >> "$GITHUB_OUTPUT"
            echo "every-plugin=true" >> "$GITHUB_OUTPUT"
            echo "host=true" >> "$GITHUB_OUTPUT"
            echo "regression-http=true" >> "$GITHUB_OUTPUT"
            echo "regression-framework=true" >> "$GITHUB_OUTPUT"
            echo "regression-browser=true" >> "$GITHUB_OUTPUT"
            echo "regression-unit=true" >> "$GITHUB_OUTPUT"
            echo "image-smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$DIFF" | grep -qE '^tests/regression/lib/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json)$|^\.github/workflows/ci\.yml$'; then
            echo "regression-unit=true" >> "$GITHUB_OUTPUT"
          else
            echo "regression-unit=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -qE '^Dockerfile$|^scripts/|^host/|^api/|^ui/|^plugins/|^packages/|^tests/|^bos\.config\.json$|^\.env\.test$|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json)$|^\.github/workflows/ci\.yml$'; then
            echo "image-smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "image-smoke=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -qE '^packages/everything-dev/|^packages/every-plugin/|^packages/better-near-auth/|^api/|^plugins/|^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.json)$|^\.github/workflows/ci.yml$'; then
            echo "everything-dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "everything-dev=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -qE '^packages/every-plugin/|^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.json)$|^\.github/workflows/ci.yml$'; then
            echo "every-plugin=true" >> "$GITHUB_OUTPUT"
          else
            echo "every-plugin=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -qE '^host/|^ui/|^packages/|^bos\.config\.json$|^\.env\.test$|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json)$|^\.github/workflows/ci\.yml$'; then
            echo "host=true" >> "$GITHUB_OUTPUT"
          else
            echo "host=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -qE '^tests/regression/(http|lib)/|^host/|^api/|^plugins/|^packages/|^scripts/|^Dockerfile$|^bos\.config\.json$|^\.env\.test$|^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.json)$|^\.github/workflows/ci\.yml$'; then
            echo "regression-http=true" >> "$GITHUB_OUTPUT"
          else
            echo "regression-http=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -qE '^tests/regression/(framework|lib)/|^packages/everything-dev/src/|^packages/every-plugin/src/|^\.env\.test$|^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.json)$|^\.github/workflows/ci\.yml$'; then
            echo "regression-framework=true" >> "$GITHUB_OUTPUT"
          else
            echo "regression-framework=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -qE '^tests/regression/(browser|lib)/|^host/|^ui/|^api/|^plugins/|^packages/|^scripts/|^Dockerfile$|^bos\.config\.json$|^\.env\.test$|^(package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.json)$|^\.github/workflows/ci\.yml$'; then
            echo "regression-browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "regression-browser=false" >> "$GITHUB_OUTPUT"
          fi

  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Guard — no stray bun artifacts
        run: |
          if [ -f bun.lock ]; then
            echo "::error::bun.lock present — bun re-migrated the workspace (ADR 0026). Delete bun.lock and re-run pnpm install."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Patch Effect TypeScript-Go (tsgo) and Oxlint
        run: pnpm run prepare

      - name: Security audit
        id: audit
        timeout-minutes: 5
        env:
          AUDIT_STRICT: ${{ secrets.AUDIT_STRICT }}
        run: |
          set +e -o pipefail
          timeout 240 pnpm audit --json 2>&1 | tee audit-output.txt
          audit_exit=$?
          if [ "$audit_exit" -eq 124 ]; then
            echo "::warning::pnpm audit timed out after 240s — skipping vulnerability check"
            exit 0
          fi
          if [ "$audit_exit" -gt 1 ]; then
            echo "::warning::pnpm audit exited with code $audit_exit — see output above"
            exit 0
          fi
          if grep -qiE '(critical|high)' audit-output.txt; then
            if [ "$AUDIT_STRICT" = "true" ]; then
              echo "::error::Critical or high vulnerabilities found — failing the audit"
              exit 1
            else
              echo "::warning::Critical or high vulnerabilities found — set AUDIT_STRICT=true secret to fail on these"
            fi
          fi

      - name: Run Biome lint and format check
        run: pnpm exec biome ci .

      - name: Run Effect lint (oxlint, type-aware)
        run: pnpm run lint:effect

      - name: Check agent skills lock
        run: pnpm run skills:check

      - name: Check docs links
        run: pnpm run docs:check

      - name: Run typecheck
        run: pnpm run typecheck

      # The build train: staleness-checked quiet prerequisites
      # (every-plugin / everything-dev / better-near-auth) + the template
      # plugin target — contract types + manifest pipeline in one call.
      - name: Build template plugin via the train (contract types + manifest pipeline)
        run: pnpm run build template

  framework-tests:
    name: Framework tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.everything-dev == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build framework dists via the train
        run: pnpm run build template

      - name: Test everything-dev
        run: pnpm --filter everything-dev test

      - name: Test better-near-auth
        run: pnpm --filter better-near-auth test

  plugin-tests:
    name: Plugin runtime tests
    needs: [detect-changes]
    if: needs.detect-changes.outputs.every-plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin dist via the train
        run: pnpm run build template

      - name: Test every-plugin
        run: pnpm --filter every-plugin test:all

  host-tests:
    name: Host tests
    needs: [detect-changes, lint-and-typecheck]
    if: needs.detect-changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Patch Effect TypeScript-Go (tsgo) and Oxlint
        run: pnpm run prepare

      - name: Build framework dists via the train
        run: pnpm run build template

      - name: Test host
        run: pnpm --filter host test

  regression-unit:
    name: Regression unit
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-typecheck]
    if: needs.detect-changes.outputs.regression-unit == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run regression lib unit tests
        run: pnpm run test:regression:unit

  regression-http:
    name: Regression HTTP (${{ matrix.command }})
    strategy:
      fail-fast: false
      matrix:
        # dev = the dev server; start = the deployment image (ADR 0009).
        # http is render-mode-blind, so it runs on :ssr only. The start leg
        # pays the docker build, hence the longer timeout.
        include:
          - command: dev
            timeout: 15
          - command: start
            timeout: 25
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-typecheck]
    if: needs.detect-changes.outputs.regression-http == 'true'
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CI: true
      API_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5434/api_test_db
      AUTH_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5435/auth_test_db
      CORS_ORIGIN: http://localhost:4100
      BETTER_AUTH_SECRET: regression-test-secret-do-not-use-in-production
    services:
      postgres-api-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: api_test_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d api_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-auth-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: auth_test_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d auth_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0 (Node 24)
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin dist via the train
        if: matrix.command == 'dev'
        run: pnpm run build template

      - name: Run HTTP regression suite (${{ matrix.command }})
        run: pnpm run test:regression:http:${{ matrix.command }}

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: regression-http-artifacts-${{ matrix.command }}
          path: .bos/logs/**

  regression-framework:
    name: Regression framework (process death)
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-typecheck]
    if: needs.detect-changes.outputs.regression-framework == 'true'
    timeout-minutes: 15
    env:
      CI: true
      API_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5434/api_test_db
      AUTH_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5435/auth_test_db
      BETTER_AUTH_SECRET: regression-test-secret-do-not-use-in-production
    services:
      postgres-api-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: api_test_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d api_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-auth-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: auth_test_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d auth_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0 (Node 24)
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin dist via the train
        run: pnpm run build template

      - name: Run framework regression suite
        run: pnpm run test:regression:framework

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: regression-framework-artifacts
          path: .bos/logs/**

  regression-browser:
    name: Regression Browser (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        # start:* = the deployment image via `bos start --config` (full suite);
        # dev:* = the dev server, smoke-only (ADR 0009). The start legs pay
        # the docker build, hence the longer timeout.
        include:
          - mode: start:ssr
            slug: start-ssr
            timeout: 25
          - mode: start:csr
            slug: start-csr
            timeout: 25
          - mode: dev:ssr
            slug: dev-ssr
            timeout: 10
          - mode: dev:csr
            slug: dev-csr
            timeout: 10
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-typecheck]
    if: needs.detect-changes.outputs.regression-browser == 'true'
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CI: true
      API_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5434/api_test_db
      AUTH_DATABASE_URL: postgres://everythingdev:everythingdev@127.0.0.1:5435/auth_test_db
      CORS_ORIGIN: http://localhost:4100
      BETTER_AUTH_SECRET: regression-test-secret-do-not-use-in-production
    services:
      postgres-api-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: api_test_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d api_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-auth-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: auth_test_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d auth_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin dist via the train
        if: startsWith(matrix.mode, 'dev:')
        run: pnpm run build template

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (Node 24)
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Resource watchdog
        run: |
          nohup bash -c 'while true; do
            echo "=== watchdog $(date -u +%H:%M:%S) ==="
            free -m
            ps aux --sort=-rss | head -11
            sleep 30
          done' >> resource-watchdog.log 2>&1 &

      - name: Run browser regression suite (${{ matrix.mode }})
        run: pnpm run test:regression:browser:${{ matrix.mode }}

      - name: Upload regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: regression-browser-artifacts-${{ matrix.slug }}
          path: |
            .bos/logs/**
            resource-watchdog.log
            playwright-report/**
            test-results/**

  image-smoke:
    name: Runtime image smoke
    runs-on: ubuntu-latest
    needs: [detect-changes, lint-and-typecheck]
    if: needs.detect-changes.outputs.image-smoke == 'true'
    # Transitional: the live published config predates version-manifest pins,
    # so a registry-start fails with "redeploy required" until the next
    # `bos deploy` republishes with pins. Flip to blocking after that deploy.
    continue-on-error: true
    timeout-minutes: 25
    env:
      CI: true
    services:
      postgres-api-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: api_test_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d api_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      postgres-auth-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everythingdev
          POSTGRES_PASSWORD: everythingdev
          POSTGRES_DB: auth_test_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U everythingdev -d auth_test_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Build runtime image
        run: docker build --target runtime -t everything-dev-smoke:local .

      - name: Boot and smoke the image
        run: node tests/smoke/runtime-image.mjs --image everything-dev-smoke:local

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: image-smoke-artifacts
          path: |
            .bos/logs/**
