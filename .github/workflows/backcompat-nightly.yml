# Nightly backcompat tier (docs/agents/testing.md tiering): the
# `test:regression:backcompat` suites (http + browser) exercise the stack in
# its backcompat mode and were never wired into per-merge CI (scripts-only
# until now). They do not need to sit on the merge gate — none of the
# platform's runtime behavior changes commit-to-commit that fast — so they
# run on a nightly schedule with the same artifact-upload conventions as the
# other regression jobs. `workflow_dispatch` stays available for triage.
name: Backcompat nightly

on:
  schedule:
    # 03:07 UTC daily — off the top-of-hour runner-queue surge.
    - cron: "7 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registry-sentinel:
    name: Registry sentinel (cold-cache resolution)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The registry-primitive ticket-12 sentinel: cold-cache resolution of
      # the published chain exactly as a fresh child does — the manifest tag
      # serves, the version record is byte-identical, the machine resolves
      # Latest + Pinned, and no extends ancestor is a dead-end (the
      # gateway-incident detector). Red = registry-side drift, independent
      # of any deploy or PR.
      - name: Run the registry sentinel
        run: node --import tsx scripts/registry-sentinel.mts

  backcompat:
    name: Backcompat regression (http + browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: true
      CORS_ORIGIN: http://localhost:4100
      BETTER_AUTH_SECRET: regression-test-secret-do-not-use-in-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0 (Node 24)
        with:
          go-version: "1.22"

      - name: Get pnpm store dir
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5 (Node 24)
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin dist
        run: pnpm run build template

      # Shared browser install (cache + probe-gated system deps) — the apt-hang
      # rationale lives in the action. Child repos reuse it cross-repo:
      # NEARBuilders/everything-dev/.github/actions/install-playwright
      - uses: ./.github/actions/install-playwright

      - name: Run backcompat regression suites (http + browser)
        run: pnpm run test:regression:backcompat

      - name: Upload regression artifacts on failure or cancel
        if: ${{ !success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: regression-backcompat-artifacts
          path: |
            .bos/logs/**
            playwright-report/**
            test-results/**
