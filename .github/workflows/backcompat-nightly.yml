# Nightly main-tip proof + backcompat tier (docs/agents/testing.md): the
# full regression matrix runs here so the main tip is continuously proven
# without paying it per-PR (T1), plus the registry sentinel (cold-cache
# resolution of the published chain — red means registry-side drift,
# independent of any deploy or PR). The release gate (release.yml) runs the
# same matrix before every publish. `workflow_dispatch` stays available for
# triage.
name: Backcompat nightly

on:
  schedule:
    # 03:07 UTC daily — off the top-of-hour runner-queue surge.
    - cron: "7 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registry-sentinel:
    name: Registry sentinel (cold-cache resolution)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The registry-primitive ticket-12 sentinel: cold-cache resolution of
      # the published chain exactly as a fresh child does — the manifest tag
      # serves, the version record is byte-identical, the machine resolves
      # Latest + Pinned, and no extends ancestor is a dead-end (the
      # gateway-incident detector).
      - name: Run the registry sentinel
        run: node --import tsx scripts/registry-sentinel.mts

  full-regression:
    name: Full regression (main tip — unit + dev + start + backcompat + framework)
    uses: ./.github/workflows/regression-full.yml
