name: Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_TESTNET_PRIVATE_KEY }}
      BOS_STORAGE_API_KEY: ${{ secrets.BOS_STORAGE_API_KEY }}
      BOS_BUNDLE_CDN_ORIGIN: https://cdn.everything.dev
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Deploy staging (preflight → build → upload → publish → image → Railway)
        timeout-minutes: 50
        run: pnpm run bos deploy --env staging${{ inputs.verbose == true && ' --verbose' || '' }}
