name: Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    env:
      BOS_INSTALL_NEAR_CLI: "true"
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
      ZE_SERVER_TOKEN: ${{ secrets.ZEPHYR_AUTH_TOKEN }}
      ZE_USER_EMAIL: ${{ secrets.ZEPHYR_USER_EMAIL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.20"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build every-plugin
        run: bun run --cwd packages/every-plugin build

      - name: Run postinstall
        run: bun run postinstall

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        run: bun packages/everything-dev/src/cli.ts deploy --env staging

      - name: Verify bos.config.json changes
        run: |
          echo "=== git status ==="
          git status --short
          echo "=== git diff bos.config.json ==="
          git diff bos.config.json || echo "No diff found"
          echo "=== bos.config.json app.ui.production ==="
          python3 -c "import json; c=json.load(open('bos.config.json')); print(c.get('app',{}).get('ui',{}).get('production','MISSING'))"
          echo "=== bos.config.json last modified ==="
          ls -la bos.config.json

      - name: Commit bos.config.json updates
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: update staging deployment URLs [skip ci]"
          file_pattern: "**/bos.config.json"