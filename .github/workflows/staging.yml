# FRAMEWORK-OWNED — reconciled from the parent template by `bos sync` / `bos upgrade`.
# Local edits are allowed: on the next sync the template version wins and your copy
# is backed up under `.bos/sync-backup/`. To make a change permanent, file an issue:
# https://github.com/NEARBuilders/everything-dev/issues
name: Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show full build output instead of clean summary'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy Staging
    # Dispatches must run against the staging branch — a manual run on another
    # ref would deploy unreviewed code to the staging environment.
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_TESTNET_PRIVATE_KEY }}
      BOS_STORAGE_ORIGIN: https://upload.everything.dev
      BOS_STORAGE_API_KEY: ${{ secrets.BOS_STORAGE_API_KEY }}
      BOS_BUNDLE_CDN_ORIGIN: https://cdn.everything.dev
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
      # Staging pushes its own image namespace — staging runs never move the
      # production image tags (sha-*/latest on ghcr.io/nearbuilders/everything-dev).
      BOS_IMAGE: ghcr.io/nearbuilders/everything-dev-staging
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          ref: ${{ github.ref }}

      - name: Guard — no stray bun artifacts
        run: |
          if [ -f bun.lock ]; then
            echo "::error::bun.lock present — bun re-migrated the workspace (ADR 0026). Delete bun.lock and re-run pnpm install."
            exit 1
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy staging (preflight → build → upload → publish → image → Railway)
        timeout-minutes: 50
        run: pnpm run bos deploy --env staging${{ inputs.verbose == true && ' --verbose' || '' }}

      # Note: staging intentionally has no post-deploy verification parity with
      # production today — the bundle compatibility check (bos mf check) and the
      # remote smoke test are production-only because they assert production
      # URLs. Adding staging-scoped verification is a follow-up.
