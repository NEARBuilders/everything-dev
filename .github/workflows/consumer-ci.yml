name: Consumer CI

# Reusable CI for generated child repos — never runs in this repo.
# The caller owns triggers, permissions policy, and secrets. This workflow
# only assumes a directory (`working_directory`) from which the child repo's
# standard scripts are valid: pnpm install, pnpm audit, biome, typecheck, test.

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory exposing the repo''s standard scripts (default: repo root)'
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)

      - name: Guard — no stray bun artifacts
        run: |
          if [ -f bun.lock ]; then
            echo "::error::bun.lock present — bun re-migrated the workspace (ADR 0026). Delete bun.lock and re-run pnpm install."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Security audit
        id: audit
        timeout-minutes: 5
        env:
          AUDIT_STRICT: ${{ secrets.AUDIT_STRICT }}
        run: |
          set +e -o pipefail
          timeout 240 pnpm audit --json 2>&1 | tee audit-output.txt
          audit_exit=$?
          if [ "$audit_exit" -eq 124 ]; then
            echo "::warning::pnpm audit timed out after 240s — skipping vulnerability check"
            exit 0
          fi
          if [ "$audit_exit" -gt 1 ]; then
            echo "::warning::pnpm audit exited with code $audit_exit — see output above"
            exit 0
          fi
          if grep -qiE '(critical|high)' audit-output.txt; then
            if [ "$AUDIT_STRICT" = "true" ]; then
              echo "::error::Critical or high vulnerabilities found — failing the audit"
              exit 1
            else
              echo "::warning::Critical or high vulnerabilities found — set AUDIT_STRICT=true secret to fail on these"
            fi
          fi

      - name: Run Biome lint and format check
        run: pnpm exec biome ci .

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test
