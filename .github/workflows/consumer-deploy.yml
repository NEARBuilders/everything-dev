name: Consumer Deploy

# Reusable production deploy for generated child repos — never runs in this
# repo. The caller owns triggers, permissions policy, and secrets (pass
# `secrets: inherit` or map them explicitly). Runs the child's deploy command
# (`pnpm run bos deploy`) from `working_directory`; the CLI degrades
# gracefully when no image or Railway service is configured.

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Directory exposing the repo''s standard scripts (default: repo root)'
        required: false
        type: string
        default: .
      verbose:
        description: Show full build output instead of clean summary
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
        shell: bash
    env:
      NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
      BOS_STORAGE_API_KEY: ${{ secrets.BOS_STORAGE_API_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (Node 24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Guard — no stray bun artifacts
        run: |
          if [ -f bun.lock ]; then
            echo "::error::bun.lock present — bun re-migrated the workspace (ADR 0026). Delete bun.lock and re-run pnpm install."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Deploy (preflight → build → upload → publish → image → Railway)
        timeout-minutes: 35
        run: pnpm run bos deploy${{ inputs.verbose == true && ' --verbose' || '' }}
