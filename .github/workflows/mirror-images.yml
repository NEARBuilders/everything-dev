name: Mirror base images

# Docker Hub and ECR Public both rate-limit GitHub-hosted runners' shared
# egress IPs (Docker Hub 504s motivated the ECR move; ECR then throttled with
# `toomanyrequests: Data limit exceeded`, killing jobs before setup). The
# org's GHCR mirror is the pull source for the library base images;
# this workflow refreshes it from upstream. Renovate tracks the mirrors and
# PRs the digest bumps. New GHCR packages land private — flip them public in
# package settings once.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday ~05:17 UTC
    - cron: "17 5 * * 1"

permissions:
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: public.ecr.aws/docker/library/node:24-alpine
            fallback: docker.io/library/node:24-alpine
            target: ghcr.io/nearbuilders/mirror-node:24-alpine
          - source: public.ecr.aws/docker/library/redis:7-alpine
            fallback: docker.io/library/redis:7-alpine
            target: ghcr.io/nearbuilders/mirror-redis:7-alpine
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Registry-to-registry manifest copy (no layer pulls into the daemon);
      # retried because both source registries rate-limit shared egress IPs.
      # The fallback is the Docker Hub original — the ECR mirror serves the
      # same manifest bytes, so the copied digest is identical either way.
      - name: Mirror
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sources=("${{ matrix.source }}" "${{ matrix.fallback }}")
          for src in "${sources[@]}"; do
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create --tag "$TARGET" "$src"; then
                docker buildx imagetools inspect "$TARGET" | head -8
                exit 0
              fi
              echo "::warning::attempt $attempt from $src failed — retrying"
              sleep $((attempt * 30))
            done
            echo "::warning::$src exhausted — falling back to next source"
          done
          exit 1
